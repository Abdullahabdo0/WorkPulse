<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkPulse — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-container {
      max-width: 440px;
      margin: 4rem auto;
      padding: 2rem;
      background: #ffffff;
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      border: 1px solid var(--border);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text);
    }
    .auth-header p {
      color: var(--muted);
      font-size: .9rem;
      margin-top: .4rem;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: .75rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all .2s;
    }
    .auth-tab.active {
      color: var(--blue);
      border-color: var(--blue);
    }
    .auth-group {
      margin-bottom: 1.25rem;
    }
    .auth-group label {
      display: block;
      font-size: .85rem;
      font-weight: 700;
      margin-bottom: .4rem;
    }
    .auth-group input {
      width: 100%;
      padding: .75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .95rem;
      outline: none;
      font-family: inherit;
      transition: border-color .2s;
    }
    .auth-group input:focus {
      border-color: var(--blue);
    }
    .btn-auth {
      width: 100%;
      padding: .85rem;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-auth:hover {
      background: #2563eb;
    }
    .quick-creds {
      margin-top: 1.5rem;
      padding: .9rem;
      background: #f8fafc;
      border-radius: 8px;
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.5;
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-start">
    <a href="login.html" class="nav-brand">⚡ Work<span>Pulse</span></a>
  </div>
  <div class="nav-end">
    <button class="lang-btn" onclick="i18n.toggle()">العربية</button>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-header">
    <div style="font-size: 2.2rem; margin-bottom:.4rem;">🔐</div>
    <h1 data-i18n="auth_portal_title">WorkPulse Access</h1>
    <p data-i18n="auth_portal_subtitle">AI Workplace Burnout Management System</p>
  </div>

  <div class="auth-notice" style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: .75rem; margin-bottom: 1.5rem; font-size: .85rem; color: #64748b; text-align: center; line-height: 1.5;">
    🔒 <span data-i18n="auth_notice">تسجيل الدخول متاح للموظفين والإدارة. حسابات الموظفين يتم إنشاؤها عبر مسؤول النظام (HR Admin) فقط.</span>
  </div>

  <!-- Login Form -->
  <form id="loginForm">
    <div class="auth-group">
      <label data-i18n="auth_username">اسم المستخدم</label>
      <input type="text" id="loginUsername" placeholder="اسم المستخدم / Username" required />
    </div>
    <div class="auth-group">
      <label data-i18n="auth_password">كلمة المرور</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn-auth" id="btnLogin" data-i18n="auth_btn_login">دخول</button>
  </form>

  <div class="alert alert-error" id="authError" style="margin-top:1rem;"></div>

</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script>
  function showError(msg) {
    const el = document.getElementById("authError");
    el.textContent = msg;
    el.classList.add("show");
  }

  // Handle Login
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    document.getElementById("authError").classList.remove("show");

    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || "فشل تسجيل الدخول");
      }

      const user = await res.json();
      AUTH.setUser(user);

      // Redirect based on role
      if (user.role === "admin") {
        window.location.href = "index.html";
      } else {
        window.location.href = "employee-portal.html";
      }
    } catch (err) {
      showError(err.message);
    }
  });
</script>

</body>
</html>
